# s إنشاء التصانيف
- name: yaml-nchng
  command: "$HOME/localx/bin/python3 $HOME/core8/pwb.py c18/scat -ns:0,10 -recentchanges:100"
  schedule: "*/20 * * * *"
  mem: 1Gi
  #cpu: 2
  image: python3.9
  emails: none

- name: ennew
  command: "$HOME/localx/bin/python3 $HOME/core8/pwb.py c18/ennew -depth:4 -range:6 -newpages:200"
  schedule: "*/25 * * * *"
  mem: 1Gi
  #cpu: 2
  image: python3.9
  emails: none

